name: Build and Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: 'stable'

jobs:
  web:
    name: Web (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env asset
        run: |
          if [ ! -f .env ]; then cp .env.example .env; fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web (release, optimized)
        run: |
          flutter build web --release \
            --base-href "/planles/"

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          if-no-files-found: error

      - name: Setup Pages
        id: pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && steps.pages.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && steps.pages.outcome == 'success'
        continue-on-error: true
        id: deployment
        uses: actions/deploy-pages@v4

  android:
    name: Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env asset
        run: |
          if [ ! -f .env ]; then cp .env.example .env; fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APKs (release, optimized)
        run: |
          mkdir -p build/symbols/android
          flutter build apk --release \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/symbols/android/split
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/symbols/android/universal

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/symbols/android
          if-no-files-found: error

  macos:
    name: macOS (DMG)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env asset
        run: |
          if [ ! -f .env ]; then cp .env.example .env; fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Disable macOS code signing (CI)
        run: |
          PBXPROJ="macos/Runner.xcodeproj/project.pbxproj"
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "Apple Development";/CODE_SIGN_IDENTITY = "-";/g' "$PBXPROJ"
          sed -i '' 's/DEVELOPMENT_TEAM = LH2AN4V894;/DEVELOPMENT_TEAM = "";/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ"

      - name: Build macOS (release, optimized)
        run: flutter build macos --release

      - name: Create DMG installer
        run: ./tool/build_macos_dmg.sh --no-build

      - name: Zip .app bundle
        run: |
          APP_PATH="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/$(basename "$APP_PATH" .app)-macos-app.zip"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env asset
        shell: bash
        run: |
          if [ ! -f .env ]; then cp .env.example .env; fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows (release, optimized)
        run: flutter build windows --release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Create Windows installer package
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches.Groups[1].Value.Split('+')[0]
          $outDir = "dist"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $src = "build/windows/x64/runner/Release"
          if (-not (Test-Path $src)) { $src = "build/windows/runner/Release" }
          $src = (Resolve-Path $src).Path
          $outDir = (Resolve-Path $outDir).Path
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc "/DMyAppVersion=$version" "/DSourceDir=$src" "/DOutputDir=$outDir" "tool\windows_installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compiler failed with exit code $LASTEXITCODE" }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [web, android, macos, windows]
    runs-on: ubuntu-latest
    if: always() && needs.web.result == 'success' && needs.android.result == 'success' && needs.macos.result == 'success' && needs.windows.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          VERSION="${VERSION:-0.0.0}"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

          # Web
          if [ -d release-artifacts/web-build ]; then
            (cd release-artifacts/web-build && zip -r "../../release-assets/Planles-${VERSION}-web.zip" .)
          fi

          # Android APKs and symbols
          if [ -d release-artifacts/android-apks ]; then
            find release-artifacts/android-apks -type f -name '*.apk' -exec cp {} release-assets/ \;
            if [ -d release-artifacts/android-apks/build/symbols ]; then
              (cd release-artifacts/android-apks/build && zip -r "../../../release-assets/Planles-${VERSION}-android-symbols.zip" symbols)
            elif [ -d release-artifacts/android-apks/symbols ]; then
              (cd release-artifacts/android-apks && zip -r "../../release-assets/Planles-${VERSION}-android-symbols.zip" symbols)
            fi
          fi

          # macOS
          if [ -d release-artifacts/macos-build ]; then
            find release-artifacts/macos-build -type f \( -name '*.dmg' -o -name '*.zip' \) -exec cp {} release-assets/ \;
          fi

          # Windows
          if [ -d release-artifacts/windows-build ]; then
            find release-artifacts/windows-build -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.zip' \) -exec cp {} release-assets/ \;
          fi

          echo "Prepared release assets:"
          ls -lah release-assets

      - name: Set release metadata
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=Planles ${APP_VERSION} build ${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ env.PRERELEASE }}
          make_latest: ${{ env.PRERELEASE == 'false' }}
          files: release-assets/*
