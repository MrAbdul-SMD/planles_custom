name: Build and Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: 'stable'

jobs:
  web:
    name: Web (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env asset
        run: |
          if [ ! -f .env ]; then cp .env.example .env; fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: |
          mkdir -p build/ios/SourcePackages build/macos/SourcePackages
          flutter pub get

      - name: Build web (release, optimized)
        run: |
          BUILD_NAME="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            BUILD_NAME="${GITHUB_REF_NAME#v}"
          fi
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/" \
            --build-name "$BUILD_NAME" \
            --build-number "${GITHUB_RUN_NUMBER}"

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          if-no-files-found: error

      - name: Setup Pages
        id: pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && steps.pages.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && steps.pages.outcome == 'success'
        continue-on-error: true
        id: deployment
        uses: actions/deploy-pages@v4

  android:
    name: Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env asset
        run: |
          if [ ! -f .env ]; then cp .env.example .env; fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: |
          mkdir -p build/ios/SourcePackages build/macos/SourcePackages
          flutter pub get

      - name: Configure Android signing (optional)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build APKs (release, optimized)
        run: |
          BUILD_NAME="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            BUILD_NAME="${GITHUB_REF_NAME#v}"
          fi
          mkdir -p build/symbols/android
          flutter build apk --release \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/symbols/android/split \
            --build-name "$BUILD_NAME" \
            --build-number "${GITHUB_RUN_NUMBER}"
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/symbols/android/universal \
            --build-name "$BUILD_NAME" \
            --build-number "${GITHUB_RUN_NUMBER}"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/symbols/android
          if-no-files-found: error

  macos:
    name: macOS (DMG)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env asset
        run: |
          if [ ! -f .env ]; then cp .env.example .env; fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: |
          mkdir -p build/ios/SourcePackages build/macos/SourcePackages
          flutter pub get

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Configure macOS signing certificate (optional)
        id: macos_sign
        if: ${{ env.MACOS_CERTIFICATE_P12_BASE64 != '' && env.MACOS_CERTIFICATE_PASSWORD != '' && env.MACOS_CODESIGN_IDENTITY != '' }}
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Disable Xcode project signing (CI build unsigned, sign post-build if configured)
        run: |
          PBXPROJ="macos/Runner.xcodeproj/project.pbxproj"
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "Apple Development";/CODE_SIGN_IDENTITY = "-";/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "-";/g' "$PBXPROJ"
          sed -i '' 's/DEVELOPMENT_TEAM = LH2AN4V894;/DEVELOPMENT_TEAM = "";/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ"

      - name: Build macOS (release, optimized)
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          MACOS_SIGN_ENABLED: ${{ steps.macos_sign.outputs.enabled }}
        run: |
          BUILD_NAME="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            BUILD_NAME="${GITHUB_REF_NAME#v}"
          fi
          flutter build macos --release --build-name "$BUILD_NAME" --build-number "${GITHUB_RUN_NUMBER}"
          APP_PATH="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          if [[ "${MACOS_SIGN_ENABLED}" == "true" && -n "${MACOS_CODESIGN_IDENTITY:-}" ]]; then
            if [[ -n "${MACOS_TEAM_ID:-}" ]]; then
              /usr/libexec/PlistBuddy -c "Set :TeamIdentifier ${MACOS_TEAM_ID}" "$APP_PATH/Contents/Info.plist" 2>/dev/null || true
            fi
            codesign --force --deep --options runtime --sign "$MACOS_CODESIGN_IDENTITY" "$APP_PATH"
            codesign --verify --deep --strict --verbose=2 "$APP_PATH" || echo "Warning: codesign verification failed (self-signed or non-Apple certs may not pass strict verification)."
          fi

      - name: Create DMG installer
        run: ./tool/build_macos_dmg.sh --no-build

      - name: Zip .app bundle
        run: |
          APP_PATH="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/$(basename "$APP_PATH" .app)-macos-app.zip"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env asset
        shell: bash
        run: |
          if [ ! -f .env ]; then cp .env.example .env; fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: |
          mkdir -p build/ios/SourcePackages build/macos/SourcePackages
          flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows (release, optimized)
        shell: pwsh
        run: |
          $buildName = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches.Groups[1].Value.Split('+')[0]
          if ($env:GITHUB_REF -like 'refs/tags/*') { $buildName = $env:GITHUB_REF_NAME.TrimStart('v') }
          flutter build windows --release --build-name $buildName --build-number $env:GITHUB_RUN_NUMBER

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Create Windows installer package
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches.Groups[1].Value.Split('+')[0]
          if ($env:GITHUB_REF -like 'refs/tags/*') { $version = $env:GITHUB_REF_NAME.TrimStart('v') }
          $outDir = "dist"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $src = "build/windows/x64/runner/Release"
          if (-not (Test-Path $src)) { $src = "build/windows/runner/Release" }
          $src = (Resolve-Path $src).Path
          $outDir = (Resolve-Path $outDir).Path
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc "/DMyAppVersion=$version" "/DSourceDir=$src" "/DOutputDir=$outDir" "tool\windows_installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compiler failed with exit code $LASTEXITCODE" }

      - name: Sign Windows installer (optional)
        if: ${{ env.WINDOWS_CERTIFICATE_PFX_BASE64 != '' && env.WINDOWS_CERTIFICATE_PASSWORD != '' }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1).FullName
          if (-not $signtool) { throw "signtool.exe not found in Windows Kits" }
          Get-ChildItem "dist" -Filter *.exe | ForEach-Object {
            & $signtool sign /fd SHA256 /f $pfxPath /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($_.Name)" }
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [web, android, macos, windows]
    runs-on: ubuntu-latest
    if: always() && needs.web.result == 'success' && needs.android.result == 'success' && needs.macos.result == 'success' && needs.windows.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          VERSION="${VERSION:-0.0.0}"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

          # Web
          if [ -d release-artifacts/web-build ]; then
            (cd release-artifacts/web-build && zip -r "../../release-assets/Planles-${VERSION}-web.zip" .)
          fi

          # Android APKs and symbols
          if [ -d release-artifacts/android-apks ]; then
            find release-artifacts/android-apks -type f -name '*.apk' -exec cp {} release-assets/ \;
            if [ -d release-artifacts/android-apks/build/symbols ]; then
              (cd release-artifacts/android-apks/build && zip -r "../../../release-assets/Planles-${VERSION}-android-symbols.zip" symbols)
            elif [ -d release-artifacts/android-apks/symbols ]; then
              (cd release-artifacts/android-apks && zip -r "../../release-assets/Planles-${VERSION}-android-symbols.zip" symbols)
            fi
          fi

          # macOS
          if [ -d release-artifacts/macos-build ]; then
            find release-artifacts/macos-build -type f \( -name '*.dmg' -o -name '*.zip' \) -exec cp {} release-assets/ \;
          fi

          # Windows
          if [ -d release-artifacts/windows-build ]; then
            find release-artifacts/windows-build -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.zip' \) -exec cp {} release-assets/ \;
          fi

          echo "Prepared release assets:"
          ls -lah release-assets

      - name: Set release metadata
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=Planles ${APP_VERSION} build ${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ env.PRERELEASE }}
          make_latest: ${{ env.PRERELEASE == 'false' }}
          files: release-assets/*
