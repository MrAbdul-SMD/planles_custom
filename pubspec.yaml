name: planles_custom
description: "Planles — driving school app for students and instructors."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.3

  # Navigation
  go_router: ^18.1.3

  # Networking
  dio: ^5.11.1
  pretty_dio_logger: ^1.4.0

  # Local storage
  shared_preferences: ^2.5.6

  # Formatting / external links / images / documents
  intl: ^0.20.3
  url_launcher: ^6.3.3
  cached_network_image: ^4.0.6
  printing: ^5.15.1
  flutter_dotenv: ^6.0.1
  app_links: ^7.2.2
  google_fonts: ^9.0.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: 17.2.3

  # Image picking for car image upload (instructor registration)
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Enables `flutter gen-l10n` during pub get / build / test.
  generate: true

  assets:
    # Client-side configuration loaded with flutter_dotenv.
    - .env
