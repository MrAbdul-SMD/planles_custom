name: planles_custom
description: "Planles — driving school app for students and instructors."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.3

  # Navigation
  go_router: ^18.1.3

  # Networking
  dio: ^5.11.1
  pretty_dio_logger: ^1.4.0

  # Local storage
  shared_preferences: ^2.5.6

  # Serialization / immutable models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Forms & connectivity
  formz: ^0.8.0
  connectivity_plus: ^6.1.3

  # UI polish (motion, loading, splash)
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  skeletonizer: ^3.0.0
  shimmer: ^3.0.0
  flutter_native_splash: ^2.4.4

  # Formatting / external links / images / documents
  intl: ^0.20.2
  url_launcher: ^6.3.3
  cached_network_image: ^4.0.3
  printing: ^5.15.1
  flutter_dotenv: ^6.0.1
  app_links: ^7.2.2
  google_fonts: ^8.0.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: 17.2.3
  package_info_plus: ^9.0.0

  # Image picking for car image upload (instructor registration)
  image_picker: ^1.0.7
  web: ^1.1.1
  file_picker: ^10.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^3.0.6
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true

  # Enables `flutter gen-l10n` during pub get / build / test.
  generate: true

  assets:
    # Client-side configuration loaded with flutter_dotenv.
    - .env
    - assets/branding/

flutter_native_splash:
  color: "#024089"
  image: assets/branding/planles_logo.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#024089"
    image: assets/branding/planles_logo.png

